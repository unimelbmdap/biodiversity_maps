
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polygon Map</title>

    <link rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">

    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>

    <style>
        body { margin: 0; }
        #map { width: 100vw; height: 100vh; }

        .polygon-tooltip .maplibregl-popup-content {
            background-color: rgba(211, 211, 211, 0.7);
            color: black;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .polygon-tooltip .maplibregl-popup-tip {
            display: none;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/dark",
    center: [144.95, -37.85],
    zoom: 8.8,
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on("load", () => { 
        const tilesURL = new URL(
            "./tiles/igs_polygons.pmtiles",
            window.location.href
        ).href;

        map.addSource("igs_polygons", {
            type: "vector",
            url: `pmtiles://${tilesURL}`
        });

    map.addLayer({
        id: "polygon-fill",
        type: "fill",
        source: "igs_polygons",
        "source-layer": "igs_combined",
        paint: {
            "fill-color": "#9FB825",
            "fill-opacity": 1
        }
        });

    const popup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 12,
        className: "polygon-tooltip"
    });

    // Track whether the popup was opened by a mobile tap
    let touchPopupActive = false;

    // Reusable tooltip function
    function showTooltip(e) {
        if (!e.features?.length) return;

        const p = e.features[0].properties;

        const content = document.createElement("div");

        const heading = document.createElement("strong");
        heading.textContent = p.name ?? "";
        content.appendChild(heading);

        const detail = document.createElement("div");
        detail.textContent = `Space type: ${p.space_type ?? "N/A"}`;
        content.appendChild(detail);

        popup
            .setLngLat(e.lngLat)
            .setDOMContent(content)
            .addTo(map);
    }

    // Desktop: tooltip follows the mouse
    map.on("mousemove", "polygon-fill", (e) => {
        if (e.originalEvent?.pointerType === "touch") return;
        if (touchPopupActive) return;

        map.getCanvas().style.cursor = "pointer";

        // e.lngLat updates with each mouse movement
        showTooltip(e);
    });

    // Desktop: hide tooltip when leaving a polygon
    map.on("mouseleave", "polygon-fill", () => {
        map.getCanvas().style.cursor = "";

        if (!touchPopupActive) {
            popup.remove();
        }
    });

    // Mobile: show tooltip on tap
    map.on("click", "polygon-fill", (e) => {
        // Only use the click handler for touch devices
        if (!window.matchMedia("(hover: none)").matches) return;

        touchPopupActive = true;
        showTooltip(e);
    });

    // Mobile: dismiss when tapping outside a polygon
    map.on("click", (e) => {
        if (!touchPopupActive) return;

        const features = map.queryRenderedFeatures(e.point, {
            layers: ["polygon-fill"]
        });

        if (!features.length) {
            popup.remove();
            touchPopupActive = false;
        }
    });
});
</script>
</body>
</html>
