<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Tree map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css"
        crossorigin="anonymous"
    >

    <style>
        html,
        body,
        #map {
            margin: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script
    src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"
    crossorigin="anonymous">
</script>

<script
    src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js">
</script>

<script>
    const protocol = new pmtiles.Protocol();

    maplibregl.addProtocol(
        "pmtiles",
        protocol.tile
    );

    const PMTILES_URL = new URL(
        "./tree_points_v4.pmtiles",
        window.location.href
    ).href;

    console.log("PMTiles URL:", PMTILES_URL);

    maplibregl.addProtocol(
        "pmtiles",
        protocol.tile
    );

    const map = new maplibregl.Map({
        container: "map",

        center: [
            144.9,
            -37.73
        ],

        zoom: 10,

        style: {
            version: 8,

            sources: {
                positron: {
                    type: "raster",
                    tiles: [
                        "https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                        "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                        "https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                        "https://d.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"
                    ],
                    tileSize: 256,
                    attribution:
                        "© OpenStreetMap contributors © CARTO"
                }
            },

            layers: [
                {
                    id: "positron",
                    type: "raster",
                    source: "positron"
                }
            ]
        }
    });

    map.on("error", (e) => {
        console.error("MapLibre error:", e.error);
    });

    map.on("load", () => {

    // 1. Add PMTiles source
    map.addSource("trees", {
        type: "vector",
        url: `pmtiles://${PMTILES_URL}`
    });


    // 2. Define sizing expressions
    const individualRadius = 1.3;
    const maxClusterRadius = 20;

    const count = [
        "to-number",
        ["coalesce", ["get", "count"], 1],
        1
    ];

    map.addLayer({
        id: "trees",
        type: "circle",
        source: "trees",
        "source-layer": "trees",

        paint: {
            "circle-color": [
                "case",

                // Individual point
                ["!=", ["get", "clustered"], true],
                "#2C421D",

                // 51–100 trees
                ["<=", ["get", "point_count"], 100],
                "#617156",

                // >100 trees
                "#95A08E"
            ],

            "circle-opacity": [
                "case",

                // Individual point
                ["!=", ["get", "clustered"], true],
                1,

                // 51–100 trees
                ["<=", ["get", "point_count"], 100],
                0.8,

                // >100 trees
                0.5
            ],

            "circle-radius": [
                "case",

                ["==", ["get", "clustered"], true],

                [
                    "min",
                    maxClusterRadius,
                    [
                        "*",
                        individualRadius,
                        ["sqrt", count]
                    ]
                ],

                individualRadius
            ]
        }
    });


    // 4. Create tooltip popup
    const popup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false
    });


    // 5. Show tooltip while hovering
    map.on("mousemove", "trees", (e) => {
    const feature = e.features[0];

    popup
        .setLngLat(e.lngLat)
        .setHTML(`
            <strong>count:</strong> ${feature.properties.count ?? "none"}<br>
            <strong>clustered:</strong> ${feature.properties.clustered ?? "none"}<br>
            <strong>point_count:</strong> ${feature.properties.point_count ?? "none"}
        `)
        .addTo(map);
});


    // 6. Pointer cursor when over a point
    map.on("mouseenter", "trees", () => {
        map.getCanvas().style.cursor = "pointer";
    });


    // 7. Remove tooltip when leaving points
    map.on("mouseleave", "trees", () => {
        map.getCanvas().style.cursor = "";
        popup.remove();
    });

});

</script>

</body>
</html>
