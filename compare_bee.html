h1 { margin:0 0 12px 0; font-size:1.05rem; }

/* Display area (previews) */
.display {
display:grid;
gap:var(--gap);
grid-template-columns: repeat(3,1fr);
margin-bottom:16px;
}
@media (max-width:900px) { .display { grid-template-columns: 1fr; } }

.slot {
border:1px solid #e2e2e2;
border-radius:6px;
overflow:hidden;
display:flex;
flex-direction:column;
min-height:220px;
background:#fff;
}

.slot-head {
padding:8px 10px;
background:#fafafa;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
font-size:0.95rem;
}

.slot iframe {
width:100%;
height: 100vh; 
border:0;
display:block;
box-sizing:border-box;
min-height:180px;
}

/* Editors area under display */
.editors {
display:grid;
gap:var(--gap);
grid-template-columns: repeat(3,1fr);
margin-top:8px;
}
@media (max-width:900px) { .editors { grid-template-columns: 1fr; } }

.editor {
border:1px solid #e9e9e9;
border-radius:6px;
padding:8px;
display:flex;
flex-direction:column;
gap:8px;
background:#fff;
}

.editor .controls {
display:flex;
gap:6px;
align-items:center;
flex-wrap:wrap;
}

.editor textarea {
width:100%;
min-height:220px;
height:260px;
box-sizing:border-box;
font-family: monospace;
font-size:12px;
padding:8px;
border:1px solid #ddd;
border-radius:4px;
resize:vertical;
white-space:pre;
}

button {
padding:6px 10px;
border-radius:6px;
border:1px solid #ccc;
background:#fafafa;
cursor:pointer;
}

.toolbar {
display:flex;
gap:8px;
align-items:center;
margin-bottom:12px;
flex-wrap:wrap;
}

.note { font-size:0.9rem; color:#444; margin-top:10px; }
</style>
</head>

</div>

    <script>
    function openService1(serviceName) {
    var panels = document.getElementsByClassName('service1');
    for (var i = 0; i < panels.length; i++) {
    panels[i].classList.remove('active');
    }
    var el = document.getElementById(serviceName);
    if (el) {
    el.classList.add('active');
    } else {
    console.warn('No panel found for', serviceName);
    }
    }

    // Lazy-load iframes: only load when panel becomes active
    document.addEventListener('DOMContentLoaded', function () {
    function loadIframeIfActive(panel) {
    var iframe = panel.querySelector('iframe[data-src]');
    if (iframe && panel.classList.contains('active')) {
        if (iframe.src === 'about:blank' || !iframe.src) {
        iframe.src = iframe.getAttribute('data-src');
        }
    }
    }

    // Load iframe for initially active panel
    var activePanel = document.querySelector('.service1.active');
    if (activePanel) loadIframeIfActive(activePanel);

    // Watch for panel changes and load iframe when panel becomes active
    var panels = document.querySelectorAll('.service1');
    var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
        if (m.target.classList && m.target.classList.contains('service1')) {
        loadIframeIfActive(m.target);
        }
    });
    });

    panels.forEach(function (panel) {
    observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
    });
    });

    // Also load iframe when button is clicked
    document.querySelectorAll('.button-bar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
    setTimeout(function () {
        var activePanel = document.querySelector('.service1.active');
        if (activePanel) {
        var iframe = activePanel.querySelector('iframe[data-src]');
        if (iframe && (iframe.src === 'about:blank' || !iframe.src)) {
            iframe.src = iframe.getAttribute('data-src');
        }
        }
    }, 50);
    });
    });

    // Ensure initial visible panel
    if (!document.querySelector('.service1.active')) {
    openService1('all_bees');
    }
    </script>

                <script>
    function openService1(serviceName) {
    var panels = document.getElementsByClassName('service1');
    for (var i = 0; i < panels.length; i++) {
    panels[i].classList.remove('active');
    }
    var el = document.getElementById(serviceName);
    if (el) {
    el.classList.add('active');
    } else {
    console.warn('No panel found for', serviceName);
    }
    }

    // Lazy-load iframes: only load when panel becomes active
    document.addEventListener('DOMContentLoaded', function () {
    function loadIframeIfActive(panel) {
    var iframe = panel.querySelector('iframe[data-src]');
    if (iframe && panel.classList.contains('active')) {
        if (iframe.src === 'about:blank' || !iframe.src) {
        iframe.src = iframe.getAttribute('data-src');
        }
    }
    }

    // Load iframe for initially active panel
    var activePanel = document.querySelector('.service1.active');
    if (activePanel) loadIframeIfActive(activePanel);

    // Watch for panel changes and load iframe when panel becomes active
    var panels = document.querySelectorAll('.service1');
    var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
        if (m.target.classList && m.target.classList.contains('service1')) {
        loadIframeIfActive(m.target);
        }
    });
    });

    panels.forEach(function (panel) {
    observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
    });
    });

    // Also load iframe when button is clicked
    document.querySelectorAll('.button-bar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
    setTimeout(function () {
        var activePanel = document.querySelector('.service1.active');
        if (activePanel) {
        var iframe = activePanel.querySelector('iframe[data-src]');
        if (iframe && (iframe.src === 'about:blank' || !iframe.src)) {
            iframe.src = iframe.getAttribute('data-src');
        }
        }
    }, 50);
    });
    });

    // Ensure initial visible panel
    if (!document.querySelector('.service1.active')) {
    openService1('all_bees');
    }
    </script>

<script>
(function () {
var ta1 = document.getElementById('ta1'), ta2 = document.getElementById('ta2'), ta3 = document.getElementById('ta3');
var ifr1 = document.getElementById('iframe1'), ifr2 = document.getElementById('iframe2'), ifr3 = document.getElementById('iframe3');
var loadBtns = document.querySelectorAll('.loadBtn'), clearBtns = document.querySelectorAll('.clearBtn');

function setSlot(n, html) {
var iframe = document.getElementById('iframe' + n);
var label = document.getElementById('label' + n);
if (!html || !html.trim()) {
    iframe.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><title>Empty</title></head><body style="padding:12px">Empty slot</body></html>';
    label.textContent = '';
    return;
}
try {
    iframe.srcdoc = html;
    label.textContent = 'loaded';
} catch (e) {
    try {
    iframe.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
    label.textContent = 'loaded';
    } catch (e2) {
    var doc = iframe.contentWindow && iframe.contentWindow.document;
    if (doc) {
        doc.open();
        doc.write(html);
        doc.close();
        label.textContent = 'loaded';
    } else {
        label.textContent = 'error';
        console.error('Unable to write to iframe', e2 || e);
    }
    }
}
}

// Sequential loader: load slots one at a time with delay
function loadSequential(slots, delay) {
var idx = 0;
function loadNext() {
    if (idx >= slots.length) return;
    var n = slots[idx];
    var content = (n === 1) ? ta1.value : (n === 2) ? ta2.value : ta3.value;
    setSlot(n, content);
    idx++;
    setTimeout(loadNext, delay);
}
loadNext();
}

loadBtns.forEach(function (btn) {
btn.addEventListener('click', function () {
    var n = btn.getAttribute('data-slot');
    var content = (n === '1') ? ta1.value : (n === '2') ? ta2.value : ta3.value;
    setSlot(n, content);
});
});

clearBtns.forEach(function (btn) {
btn.addEventListener('click', function () {
    var n = btn.getAttribute('data-slot');
    if (n === '1') ta1.value = ''; if (n === '2') ta2.value = ''; if (n === '3') ta3.value = '';
    setSlot(n, '');
});
});

// Load all: sequential with 1 second delay between slots
document.getElementById('loadAll').addEventListener('click', function () {
loadSequential([1, 2, 3], 1000);
});

document.getElementById('clearAll').addEventListener('click', function () {
ta1.value = ''; ta2.value = ''; ta3.value = '';
setSlot(1, ''); setSlot(2, ''); setSlot(3, '');
});

document.getElementById('openInWindow').addEventListener('click', function () {
var contents = ta1.value || ta2.value || ta3.value;
if (!contents) { alert('No content to open. Paste HTML into a slot first.'); return; }
var w = window.open();
w.document.open();
w.document.write(contents);
w.document.close();
});

var display = document.getElementById('display');
document.getElementById('oneCol').addEventListener('click', function () { display.style.gridTemplateColumns = '1fr'; });
document.getElementById('twoCol').addEventListener('click', function () { display.style.gridTemplateColumns = '1fr 1fr'; });
document.getElementById('threeCol').addEventListener('click', function () { display.style.gridTemplateColumns = 'repeat(3,1fr)'; });

// ----- AUTO-LOAD ON OPEN (sequential) -----
document.addEventListener('DOMContentLoaded', function () {
var toLoad = [];
if (ta1.value && ta1.value.trim()) toLoad.push(1);
if (ta2.value && ta2.value.trim()) toLoad.push(2);
if (ta3.value && ta3.value.trim()) toLoad.push(3);
if (toLoad.length > 0) {
    loadSequential(toLoad, 1200); // stagger by 1.2 seconds
}
});

setSlot(1, ''); setSlot(2, ''); setSlot(3, '');
})();
</script>
