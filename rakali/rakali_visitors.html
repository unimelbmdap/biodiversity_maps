<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>pydeck</title>
        <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v1.13.0/mapbox-gl.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap-theme.min.css" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css" />
    <script src='https://cdn.jsdelivr.net/npm/@deck.gl/jupyter-widget@~9.0.*/dist/index.js'></script>
    <style>
    body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#deck-container {
  width: 100vw;
  height: 100vh;
}

#deck-container canvas {
  z-index: 1;
  background: none;
}
    </style>
  </head>
  <body>
    <div id="deck-container">
    </div>
  </body>
  <script>
    const container = document.getElementById('deck-container');
    const jsonInput = {
  "initialViewState": {
    "latitude": -38.55,
    "longitude": 145.1,
    "pitch": 45,
    "zoom": 7.7
  },
  "layers": [
    {
      "@@type": "GeoJsonLayer",
      "data": "https://unimelbmdap.github.io/biodiversity_maps/rakali/vicmap_hydro_rivers.geojson",
      "filled": true,
      "getFillColor": [
        70,
        200,
        240
      ],
      "getLineColor": [
        70,
        200,
        240
      ],
      "id": "c0f7a469-7807-495d-adba-9d7cd253947c",
      "lineWidthMinPixels": 2,
      "pickable": false,
      "stroked": true
    },
    {
      "@@type": "GeoJsonLayer",
      "autoHighlight": true,
      "data": "https://unimelbmdap.github.io/biodiversity_maps/rakali/3bd3aff6-424f-4a6d-ae8a-0d5b8159bafc.geojson",
      "extruded": true,
      "filled": true,
      "getElevation": "@@=properties.people_count_float * 2",
      "getFillColor": [
        255,
        255,
        255
      ],
      "getLineColor": [
        255,
        255,
        255
      ],
      "id": "be74deee-7a70-43bc-af82-9ec579a104af",
      "opacity": 0.6,
      "pickable": true,
      "stroked": true
    },
    {
      "@@type": "GeoJsonLayer",
      "autoHighlight": true,
      "data": "https://unimelbmdap.github.io/biodiversity_maps/rakali/238b0b8e-2baa-49ce-bf11-0cce95e00044.geojson",
      "extruded": true,
      "filled": true,
      "getElevation": "@@=properties.people_count_float * 2",
      "getFillColor": "@@=properties.color_unimelb_magma",
      "getLineColor": [
        125,
        125,
        125
      ],
      "id": "b445dece-b2bd-4ba3-b989-86af587bbc1e",
      "opacity": 0.6,
      "pickable": true,
      "stroked": true
    }
  ],
  "mapProvider": "carto",
  "mapStyle": "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
  "views": [
    {
      "@@type": "MapView",
      "controller": {
        "dragPan": true,
        "dragRotate": true,
        "touchRotate": true,
        "touchZoom": true
      }
    }
  ]
};
    const tooltip = {'html': '<b>{sa1_name}</b><br/>Average visitor count: {people_count_string}<br/>Rakali reported sightings: {count_rakali}<br/>SA1 visitor density: {density}<br/>'};
    const customLibraries = null;
    const configuration = null;

    const deckInstance = createDeck({
                  container,
      jsonInput,
      tooltip,
      customLibraries,
      configuration
    });

  </script>
</html>
